<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <app-icon name="shield-check" [size]="20" />
      </div>
      <span class="brand-name">BaitBuster</span>
    </div>

    <nav class="nav">
      <div class="nav-group">
        <span class="nav-group-title">Анализ</span>
        <span class="nav-item" [class.active]="activeView() === 'analyze'" (click)="select('analyze')">
          <app-icon name="upload" [size]="18" />
          Нов анализ
        </span>
        <span class="nav-item" [class.active]="activeView() === 'manual'" (click)="select('manual')">
          <app-icon name="pencil" [size]="18" />
          Ръчен вход
        </span>
        <span class="nav-item" [class.active]="activeView() === 'history'" (click)="select('history')">
          <app-icon name="clock" [size]="18" />
          История
        </span>
        <span class="nav-item" [class.active]="activeView() === 'statistics'" (click)="select('statistics')">
          <app-icon name="chart-pie" [size]="18" />
          Статистика
        </span>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">Система</span>
        <span class="nav-item" [class.active]="activeView() === 'rules'" (click)="select('rules')">
          <app-icon name="list-check" [size]="18" />
          Правила
        </span>
        <span class="nav-item" [class.active]="activeView() === 'model'" (click)="select('model')">
          <app-icon name="chart-bar" [size]="18" />
          ML модел
        </span>
      </div>
    </nav>

    <button
      class="theme-toggle"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="theme() === 'dark' ? 'Превключи на светла тема' : 'Превключи на тъмна тема'"
    >
      <app-icon name="sun" [size]="14" />
      <span class="toggle-track" [class.is-dark]="theme() === 'dark'">
        <span class="toggle-thumb"></span>
      </span>
      <app-icon name="moon" [size]="14" />
    </button>
  </aside>

  <main class="content">
    <div class="content-inner">
      @switch (activeView()) {
        @case ('analyze') { <app-analyze-view /> }
        @case ('manual') { <app-manual-view /> }
        @case ('history') { <app-history-view (opened)="onHistoryOpened()" /> }
        @case ('statistics') { <app-statistics-view /> }
        @case ('rules') { <app-rules-view /> }
        @case ('model') { <app-model-view /> }
      }
    </div>
  </main>
</div>
